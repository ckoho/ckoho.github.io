<html>
<script src='https://d3js.org/d3.v5.min.js'></script>
<script src="https://unpkg.com/d3-svg-annotation@2.5.1/d3-annotation.min.js"></script>
<style> circle {} 
  .annotation path { stroke: #E64A19; fill: none; }
  .annotation text { fill: #E64A19; font-family: sans-serif; font-size: 12px; }
</style>
<body onload='init()'>
<svg width=700 height=600> 
</svg>
<a href="scene2.html">← Back&nbsp;&nbsp;</a>
<a href="scene4.html">&nbsp;&nbsp;Next →</a>
<script>
async function init() {
const svg = d3.select("svg");
const data = await d3.csv('https://flunky.github.io/cars2017.csv');
const cylinderTypes = [...new Set(data.map(d => +d.EngineCylinders))].sort((a, b) => a - b);
const fuelTypes = [...new Set(data.map(d => d.Fuel))];
  
const makeTypes = [...new Set(data.map(d => d.Make))];
var x = d3.scaleBand()
  .domain(cylinderTypes)
  .range([0, 450])
  .padding(0.5);
var y = d3.scaleLog().domain([8, 160]).range([450, 0]);
var color = d3.scaleOrdinal()
  .domain(fuelTypes)
  .range(d3.schemeCategory10);
svg.append("g")
  .attr("transform", "translate(50,50)")
  .selectAll("circle")
  .data(data)
  .enter()
  .append("circle")
    .style("opacity", 0.5)
  .attr("cx", d => {
    const columnCenter = x(+d.EngineCylinders) + x.bandwidth() / 2;
    const jitterWidth = x.bandwidth() * 0.4; 
    const randomOffset = (Math.random() - 0.5) * jitterWidth; 
    return columnCenter + randomOffset;
  })
  .attr("cy", d => y(+d.AverageCityMPG))
    .attr("fill", d => color(d.Fuel))
    .attr("r", 4);
svg.append("g")
  .attr("transform", "translate(50,50)")
  .call(
    d3.axisLeft(y)
      .tickValues([10, 20, 50, 100])
      .tickFormat(d3.format("~s"))
  );
svg.append("g")
  .attr("transform", "translate(50,500)") 
  .call(d3.axisBottom(x));
svg.append("text")
  .attr("x", 275)
  .attr("y", 30) 
  .attr("text-anchor", "middle")
  .style("font-family", "sans-serif")
  .style("font-size", "16px")
  .style("font-weight", "bold")
  .text("City MPG vs Engine Cylinders");
svg.append("text")
    .attr("x", 275)
    .attr("y", 60)
    .attr("text-anchor", "middle")
    .style("font-size", "10px")
    .style("fill", "gray")
    .text("Color indicates fuel type.");
svg.append("text")
    .attr("x", 230)
    .attr("y", 100)
    .attr("text-anchor", "middle")
    .style("font-size", "10px")
    .style("fill", "gray")
    .text("Electric engines (0 cylinder in this plot) have the best fuel.");
svg.append("text")
    .attr("x", 350)
    .attr("y", 250)
    .attr("text-anchor", "middle")
    .style("font-size", "10px")
    .style("fill", "gray")
    .text("However, for a given cylinder it seems like diesel does better MPG than gas.");
svg.append("text")
  .attr("x", 275) 
  .attr("y", 545)
  .attr("text-anchor", "middle")
  .style("font-family", "sans-serif")
  .style("font-size", "12px")
  .text("Engine Cylinders");

svg.append("text")
  .attr("transform", "rotate(-90)") 
  .attr("x", -250)                  
  .attr("y", 20)                    
  .attr("text-anchor", "middle")
  .style("font-family", "sans-serif")
  .style("font-size", "12px")
  .text("Average City MPG (Log Scale)");
const annotations = [
{
    note: {
        title: "Diesel",
        label: "For a given cylinder, it seems like diesel does better MPG than gas."
    },
    x: x(4) + x.bandwidth()/2 + 50,
    y: y(120) + 200,
    dx: 100,
    dy: 40
}
];
const makeAnnotations = d3.annotation()
    .annotations(annotations);
svg.append("g")
    .attr("transform", "translate(0,0)")
    .call(makeAnnotations);

}
</script>
</body>
</html>
