<html>
<script src='https://d3js.org/d3.v5.min.js'></script>
<style> circle {} </style>
<body onload='init()'>
<svg width=700 height=600>
</svg>
<a href="scene3.html">← Back</a>
<script>
async function init() {
const svg = d3.select("svg");
const data = await d3.csv('https://flunky.github.io/cars2017.csv');
var y = d3.scaleLog().domain([10, 160]).range([0, 450]);
var x = d3.scaleLog().domain([10, 160]).range([450, 0]);
const fuelTypes = [...new Set(data.map(d => d.Fuel))];
var color = d3.scaleOrdinal()
  .domain(fuelTypes)
  .range(d3.schemeCategory10);    
const legend = svg.append("g")
    .attr("transform", "translate(420,20)");

const legendItems = legend.selectAll("g")
    .data(color.domain())
    .enter()
    .append("g")
    .attr("transform", (d,i) => `translate(0,${i*20})`);

legendItems.append("rect")
    .attr("width",12)
    .attr("height",12)
    .attr("fill", d => color(d));

legendItems.append("text")
    .attr("x",18)
    .attr("y",10)
    .text(d => d + " fuel");  
svg.append("g")
  .attr("transform", "translate(50,50)")
  .selectAll("circle")
  .data(data)
  .enter()
  .append("circle")
    .style("opacity", 0.9)
    .attr("cy", d => x(+d.AverageCityMPG))
    .attr("fill", d => color(d.Fuel))
    .attr("cx", d => y(+d.AverageHighwayMPG))
    .attr("r", d => (2 + +d.EngineCylinders)/2);

    svg.append("g")
  .attr("transform", "translate(50,50)")
  .call(
    d3.axisLeft(y)
      .tickValues([10, 20, 50, 100])
      .tickFormat(d3.format("~s"))
  );

svg.append("g")
  .attr("transform", "translate(50,500)")
  .call(
    d3.axisBottom(x)
      .tickValues([10, 20, 50, 100])
      .tickFormat(d3.format("~s"))
  );    
  svg.append("text")
  .attr("x", 275)
  .attr("y", 30) 
  .attr("text-anchor", "middle")
  .style("font-family", "sans-serif")
  .style("font-size", "16px")
  .style("font-weight", "bold")
  .text("Highway MPG vs City MPG");
svg.append("text")
    .attr("x", 275)
    .attr("y", 60)
    .attr("text-anchor", "middle")
    .style("font-size", "10px")
    .style("fill", "gray")
    .text("Size indicates number of cylinders.");
svg.append("text")
  .attr("x", 275) 
  .attr("y", 545)
  .attr("text-anchor", "middle")
  .style("font-family", "sans-serif")
  .style("font-size", "12px")
  .text("Average Highway MPG (Log Scale)");

svg.append("text")
  .attr("transform", "rotate(-90)") 
  .attr("x", -250)                  
  .attr("y", 20)                    
  .attr("text-anchor", "middle")
  .style("font-family", "sans-serif")
  .style("font-size", "12px")
  .text("Average City MPG (Log Scale)");
}
</script>
</body>
</html>
