<html>
<script src='https://d3js.org/d3.v5.min.js'></script>
<script src="https://unpkg.com/d3-svg-annotation@2.5.1/d3-annotation.min.js"></script>
<style> circle {} 
  .annotation path { stroke: #E64A19; fill: none; }
  .annotation text { fill: #E64A19; font-family: sans-serif; font-size: 12px; }
</style>
<body onload='init()'>
<svg width=700 height=600> 
</svg>
<a href="index.html">← Back&nbsp;&nbsp;</a>
<a href="scene3.html">&nbsp;&nbsp;Next →</a><script>
async function init() {
const svg = d3.select("svg");
const data = await d3.csv('https://flunky.github.io/cars2017.csv');
const fuelTypes = [...new Set(data.map(d => d.Fuel))];
const makeTypes = [...new Set(data.map(d => d.Make))];
var x = d3.scaleBand()
  .domain(fuelTypes)
  .range([0, 450])
  .padding(0.5); 
var y = d3.scaleLog().domain([8, 160]).range([450, 0]);
var color = d3.scaleSequential(d3.interpolateRainbow)
  .domain([0, makeTypes.length]);
svg.append("g")
  .attr("transform", "translate(50,50)")
  .selectAll("circle")
  .data(data)
  .enter()
  .append("circle")
    .style("opacity", 0.5)
    .attr("cx", d => {
      const columnCenter = x(d.Fuel) + x.bandwidth() / 2;
      const jitterWidth = x.bandwidth() * 0.4; // Limits jitter to 40% of column width so categories don't mix
      const randomOffset = (Math.random() - 0.5) * jitterWidth; 
      return columnCenter + randomOffset;
      })
    .attr("cy", d => y(+d.AverageCityMPG))
    .attr("fill", d => color(makeTypes.indexOf(d.Make)))
    .attr("r", d => (2 + +d.EngineCylinders))
    .append("title").text(d => `${d.Make} (${d.EngineCylinders} Cylinders)`);
svg.append("g")
  .attr("transform", "translate(50,50)")
  .call(
    d3.axisLeft(y)
      .tickValues([10, 20, 50, 100])
      .tickFormat(d3.format("~s"))
  );
svg.append("g")
  .attr("transform", "translate(50,500)") 
  .call(d3.axisBottom(x));
svg.append("text")
  .attr("x", 275)
  .attr("y", 30) 
  .attr("text-anchor", "middle")
  .style("font-family", "sans-serif")
  .style("font-size", "16px")
  .style("font-weight", "bold")
  .text("City MPG vs Fuel Type by Engine Cylinders");
svg.append("text")
    .attr("x", 250)
    .attr("y", 60)
    .attr("text-anchor", "middle")
    .style("font-size", "12px")
    .style("fill", "gray")
    .text("Color indicates vehicle make.");
svg.append("text")
  .attr("x", 275) 
  .attr("y", 545)
  .attr("text-anchor", "middle")
  .style("font-family", "sans-serif")
  .style("font-size", "12px")
  .text("Fuel Type");

svg.append("text")
  .attr("transform", "rotate(-90)") 
  .attr("x", -250)                  
  .attr("y", 20)                    
  .attr("text-anchor", "middle")
  .style("font-family", "sans-serif")
  .style("font-size", "12px")
  .text("Average City MPG (Log Scale)");
const annotations = [
{
    note: {
        title: "Electric vehicles",
        label: "Electric cars generally have much higher city MPG equivalents."
    },
    x: x("Electricity") + x.bandwidth()/2 + 50,
    y: y(120) + 50,
    dx: 100,
    dy: -40
}
];
const makeAnnotations = d3.annotation()
    .annotations(annotations);
svg.append("g")
    .attr("transform", "translate(0,0)")
    .call(makeAnnotations);

}
</script>
</body>
</html>
