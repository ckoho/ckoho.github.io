<html>
<script src='https://d3js.org/d3.v5.min.js'></script>
<style> circle {} </style>
<body onload='init()'>
<svg width=700 height=600> 
</svg>
<a href="scene2.html">Next →</a>
<script>
async function init() {
const svg = d3.select("svg");
const data = await d3.csv('https://flunky.github.io/cars2017.csv');
var x = d3.scaleLog().domain([8, 160]).range([0, 450]);
var y = d3.scaleLog().domain([8, 160]).range([450, 0]);
var color = d3.scaleOrdinal(d3.schemeSet1);
svg.append("g")
  .attr("transform", "translate(50,50)")
  .selectAll("circle")
  .data(data)
  .enter()
  .append("circle")
    .style("opacity", 0.5)
    .attr("cy", d => y(+d.AverageCityMPG))
    .attr("cx", d => x(+d.AverageHighwayMPG))
    .attr("fill", d => "black")
    .attr("r", 5);
svg.append("g")
  .attr("transform", "translate(50,50)")
  .call(
    d3.axisLeft(y)
      .tickValues([10, 20, 50, 100])
      .tickFormat(d3.format("~s"))
  );

svg.append("g")
  .attr("transform", "translate(50,500)")
  .call(
    d3.axisBottom(x)
      .tickValues([10, 20, 50, 100])
      .tickFormat(d3.format("~s"))
  );
  svg.append("text")
  .attr("x", 275)
  .attr("y", 30) 
  .attr("text-anchor", "middle")
  .style("font-family", "sans-serif")
  .style("font-size", "16px")
  .style("font-weight", "bold")
  .text("Highway MPG vs City MPG");

svg.append("text")
  .attr("x", 275) 
  .attr("y", 545)
  .attr("text-anchor", "middle")
  .style("font-family", "sans-serif")
  .style("font-size", "12px")
  .text("Average Highway MPG (Log Scale)");

svg.append("text")
  .attr("transform", "rotate(-90)") 
  .attr("x", -250)                  
  .attr("y", 20)                    
  .attr("text-anchor", "middle")
  .style("font-family", "sans-serif")
  .style("font-size", "12px")
  .text("Average City MPG (Log Scale)");
}
</script>
</body>
</html>
